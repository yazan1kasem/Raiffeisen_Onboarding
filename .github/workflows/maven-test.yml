name: Build, Test and Deploy

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      # Stelle sicher, dass das Passwort hier als Literal gesetzt wird, um den führenden $ zu erhalten.
      MYSQL_PASSWORD: '$g7m87Tsxwz2moaS'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rbionboarding-database
          MYSQL_USER: iiyvhpemdg
          MYSQL_PASSWORD: '$g7m87Tsxwz2moaS'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Check Database Connection using properties credentials
        run: |
          echo "Trying to connect to MySQL using properties credentials..."
          mysql -h 127.0.0.1 -u iiyvhpemdg -p"$MYSQL_PASSWORD" -e "SHOW DATABASES;"
