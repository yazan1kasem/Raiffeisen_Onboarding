<h2 mat-dialog-title>Change Password for {{ user.username }}</h2>

<mat-dialog-content>
  <form [formGroup]="passwordForm">
    <mat-form-field>
      <mat-label>New Password</mat-label>
      <input matInput type="password" formControlName="newPassword" required>
      <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">Password is required</mat-error>
      <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('minlength')">Minimum 6 characters</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Confirm New Password</mat-label>
      <input matInput type="password" formControlName="confirmPassword" required>
      <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">Confirmation is required</mat-error>
    </mat-form-field>

    <!-- ✅ Fixed: Use ['mismatch'] instead of .mismatch -->
    <mat-error *ngIf="passwordForm.errors?.['mismatch']">Passwords do not match</mat-error>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" [disabled]="passwordForm.invalid" (click)="onSubmit()">Save</button>
</mat-dialog-actions>
