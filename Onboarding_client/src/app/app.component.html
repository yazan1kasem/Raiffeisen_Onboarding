<div class="app-container" [ngClass]="{ 'collapsed': isCollapsed }">
  <!-- Sidebar -->
  <div *ngIf="shouldShowSidebar()" id="sidebar-container">
    <app-sidebar  (toggle)="toggleSidebar($event)"></app-sidebar>
  </div>

  <!-- Hauptinhalt -->
  <div id="content">
    <router-outlet></router-outlet>
  </div>
</div>
