<div class="checklist-details-container" *ngIf="userChecklist">
  <h2>
    <input [(ngModel)]="userChecklist.ueberschrift" placeholder="Enter checklist title" />
  </h2>
  <ul class="item-list">
    <li *ngFor="let item of userChecklist.useritems">
      <input type="checkbox" [(ngModel)]="item.isChecked" />
      <div>{{ item.originalItem.name }}</div>
    </li>
  </ul>
  <button (click)="saveUserChecklist()">Save Changes</button>
  <button (click)="deleteUserChecklist()">Delete Checklist</button>
  <hr />
  <h3>Export Options</h3>
  <button (click)="downloadExcel()">📊 Download Excel</button>
  <button (click)="downloadPdf()">📄 Download PDF</button>
  <button (click)="downloadWord()">📝 Download Word</button>
</div>

<div *ngIf="!userChecklist">
  <p>Checkliste wird geladen oder konnte nicht gefunden werden.</p>
</div>
