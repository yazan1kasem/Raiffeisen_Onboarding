<div class="checklist-details-container" *ngIf="userChecklist">
  <h2>
    <input [(ngModel)]="userChecklist.ueberschrift" placeholder="Checklisten-Titel eingeben" />
  </h2>
  <ul class="item-list">
    <li *ngFor="let item of userChecklist.useritems">
      <input type="checkbox" [(ngModel)]="item.isChecked" />
      <div>{{ item.originalItem.name }}</div>
    </li>
  </ul>
  <button (click)="saveUserChecklist()">Änderungen speichern</button>
  <button (click)="deleteUserChecklist()">Checkliste löschen</button>
  <hr />
  <h3>Exportoptionen</h3>
  <button (click)="downloadExcel()">📊 Excel herunterladen</button>
  <button (click)="downloadPdf()">📄 PDF herunterladen</button>
  <button (click)="downloadWord()">📝 Word herunterladen</button>
</div>

<div *ngIf="!userChecklist">
  <p>Checkliste wird geladen oder konnte nicht gefunden werden.</p>
</div>
