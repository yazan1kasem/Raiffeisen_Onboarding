<div class="user-checklist-container">
  <h1>Gespeicherte Checklisten</h1>
  <ul class="checklist-list">
    <li *ngFor="let checklist of userChecklists">
      <h3>{{ checklist.ueberschrift }}</h3>
      <p>{{ checklist.beschreibung }}</p>

      <button (click)="downloadExcel(checklist)">📊 Download Excel</button>
      <button (click)="downloadPdf(checklist)">📄 Download PDF</button>
      <button (click)="downloadWord(checklist)">📝 Download Word</button>
    </li>
  </ul>
</div>
