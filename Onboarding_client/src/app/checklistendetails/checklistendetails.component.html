<div *ngIf="checklist" class="checklist-details-container">
  <ul class="item-list">
    <li *ngFor="let item of filteredItems">
      <input type="checkbox" [checked]="selectedItems.has(item)" (change)="toggleItemSelection(item)">
      <span>{{ item.name }}</span>
    </li>
  </ul>

  <button
    (click)="createUserChecklist()"
    [disabled]="!user">
    Create Checklist
  </button>

</div>
