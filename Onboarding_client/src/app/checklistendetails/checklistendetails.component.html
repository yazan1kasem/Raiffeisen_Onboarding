<div class="checklist-details">
  <h2 class="checklist-title">{{ userChecklist.ueberschrift }}</h2>

  <div class="checklist-info">
    <p><strong>Position:</strong> {{ userChecklist.originalChecklist?.position }}</p>
    <p><strong>Abteilungsname:</strong> {{ userChecklist.originalChecklist?.abteilungsname }}</p>
  </div>

  <h3 class="items-title">Items</h3>
  <div class="content">
    <ul class="items-list">
      <li
        *ngFor="let item of checklist.items"
        class="item-card"
        [ngClass]="{ 'selected': selectedItems.has(item) }"
        (click)="toggleItemSelection(item)"
      >
        <p><strong>Name:</strong> {{ item.name }}</p>
        <p><strong>Type:</strong> {{ item.type }}</p>
        <p><strong>Suchbegriff:</strong> {{ item.suchbegriff }}</p>
      </li>
    </ul>

    <button class="save-button" (click)="saveSelectedItems()">Speichern</button>
  </div>
</div>
