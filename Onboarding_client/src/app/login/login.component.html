<div class="login-container">
  <h2 class="signup-header">Login</h2>

  <!-- Display error messages -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- Login Form -->
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group">
      <label for="email">Username</label>
      <input
        type="email"
        id="email"
        class="form-control"
        [(ngModel)]="username"
        name="email"
        required
        placeholder="Enter your username"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Enter your password"
      />
    </div>

    <button type="submit" class="btn btn-raiffeisen btn-block">Login</button>
  </form>

  <p class="login-link">
    Noch kein Konto? <a routerLink="/signup">Sign Up</a>
  </p>
</div>
