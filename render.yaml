services:
  - name: onboarding-frontend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: master
    plan: starter
    dockerfilePath: Onboarding_client/Dockerfile  # ✅ Set Dockerfile inside Onboarding_client
    envVars:
      - key: SERVER_PORT
        value: "4200"
  - name: onboarding-backend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: master
    plan: starter
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://db-raiffeisen:3306/db-raiffeisen?serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root
      - key: SERVER_PORT
        value: "8081"
      - key: SECURITY_JWT_SECRET_KEY
        sync: false
      - key: SECURITY_JWT_EXPIRATION_TIME
        value: "36000000"
    healthCheckPath: /actuator/health
    region: frankfurt
    dockerfilePath: Dockerfile
  - type: pserv
    name: db-raiffeisen
    runtime: docker
    repo: https://github.com/render-examples/mysql
    plan: starter
    branch: oh/mysql_8.0.24
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: root
      - key: MYSQL_PASSWORD
        value: root
      - key: MYSQL_USER
        value: root
      - key: MYSQL_DATABASE
        value: db-raiffeisen
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./Dockerfile
    disk:
      name: disk
      mountPath: /var/lib/mysql
      sizeGB: 10
