services:
  - name: onboarding-frontend
    type: web
    runtime: static
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: master
    buildCommand: ls && cd Onboarding_client && ls && npm install && npm run build
    staticPublishPath: dist/onboarding-client/browser/assets/index.html
    routes:
      - source: /.*
        destination: /index.html
        type: rewrite
    envVars:
      - key: REACT_APP_BACKEND_URL  # Beispiel für React (kann an dein Framework angepasst werden)
        value: https://onboarding-backend.onrender.com  # Öffentliche URL des Backends

  - name: onboarding-backend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: master
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://db_raiffeisen:3306/db_raiffeisen?serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root
      - key: SERVER_PORT
        value: "8081"
      - key: SECURITY_JWT_SECRET_KEY
        sync: false
      - key: SECURITY_JWT_EXPIRATION_TIME
        value: "36000000"
    region: frankfurt
    dockerfilePath: Dockerfile

  - type: pserv
    name: db_raiffeisen
    runtime: docker
    repo: https://github.com/render-examples/mysql
    plan: starter
    branch: oh/mysql_8.0.24
    autoDeploy: true
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: root
      - key: MYSQL_PASSWORD
        value: root
      - key: MYSQL_USER
        value: root
      - key: MYSQL_DATABASE
        value: db_raiffeisen
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./Dockerfile
    disk:
      name: disk
      mountPath: /var/lib/mysql
      sizeGB: 10