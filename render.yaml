services:
  - name: db_raiffeisen
    type: pserv
    runtime: docker  # ✅ Hier hinzufügen!
    plan: starter
    envVars:
      - key: MYSQL_DATABASE
        value: db_raiffeisen
      - key: MYSQL_ROOT_PASSWORD
        value: root
    disk:
      name: db-storage
      mountPath: /var/lib/mysql

  - name: onboarding-frontend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding/tree/70f746e819845c58e3e07dfca7a0eedf50554042/Onboarding_client
    branch: master
    plan: starter
    envVars:
      - key: SERVER_PORT
        value: "4200"

  - name: onboarding-backend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: master
    plan: starter
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://db_raiffeisen:3306/db_raiffeisen?serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root
      - key: SERVER_PORT
        value: "8081"
      - key: SECURITY_JWT_SECRET_KEY
        sync: false
      - key: SECURITY_JWT_EXPIRATION_TIME
        value: "36000000"
    healthCheckPath: /actuator/health
    region: frankfurt
    dockerfilePath: Dockerfile
