services:
  - name: onboarding-frontend
    type: web
    runtime: static
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: main
    buildCommand: cd Onboarding_client && npm install && npm run build
    staticPublishPath: Onboarding_client/dist/Onboarding_client
    envVars:
      - key: API_URL
        value: https://onboarding-backend.onrender.com
    headers:
      - name: "Cache-Control"
        value: "max-age=31536000, immutable"

  - name: onboarding-backend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: main
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: db_raiffeisen
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: db_raiffeisen
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: db_raiffeisen
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SERVER_PORT
        value: "8081"
      - key: SECURITY_JWT_SECRET_KEY
        value: knPeHS16UXrpv0w4jr+8/8zbV4h8H/9CLn4snkV51EY=
      - key: SECURITY_JWT_EXPIRATION_TIME
        value: "36000000"
    healthCheckPath: /actuator/health
    region: frankfurt
    dockerfilePath: Dockerfile

databases:
  - name: db_raiffeisen
    plan: free
    databaseName: db_raiffeisen
    user: root

    connectionString: jdbc:mysql://localhost:3306/db_raiffeisen
    password: root


spring:
  - datasource:
    url: spring.datasource.url=jdbc:mysql://localhost:3306/db_raiffeisen
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  - jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
  - server:
    port: 8081

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: trace

security:
  jwt:
    secret-key: knPeHS16UXrpv0w4jr+8/8zbV4h8H/9CLn4snkV51EY=
    expiration-time: 36000000