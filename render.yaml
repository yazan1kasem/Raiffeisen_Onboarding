services:
  - name: onboarding-frontend
    type: web
    runtime: static
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: main
    buildCommand: cd Onboarding_client && npm install && npm run build
    staticPublishPath: Onboarding_client/dist/Onboarding_client
    envVars:
      - key: API_URL
        value: https://onboarding-backend.onrender.com
    headers:
      - name: "Cache-Control"
        value: "max-age=31536000, immutable"

  - name: onboarding-backend
    type: web
    runtime: docker
    repo: https://github.com/yazan1kasem/Raiffeisen_Onboarding.git
    branch: main
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-keif:10000/db_raiffeisen
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: examplepassword  # Replace with actual Render MySQL password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SERVER_PORT
        value: "8081"
      - key: SECURITY_JWT_SECRET_KEY
        value: knPeHS16UXrpv0w4jr+8/8zbV4h8H/9CLn4snkV51EY=
      - key: SECURITY_JWT_EXPIRATION_TIME
        value: "36000000"
    healthCheckPath: /actuator/health
    region: frankfurt
    dockerfilePath: Dockerfile

databases:
  - name: db_raiffeisen
    type: private
    plan: free
    repo: https://github.com/render-examples/mysql
    branch: main
    envVars:
      - key: MYSQL_DATABASE
        value: db_raiffeisen
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        value: root  # Replace with a strong password
